<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Algerian', sans-serif;
            background-image: url('/static/bg.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: #9fd9ff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            font-size: 3em;
            font-weight: 700;
            color: #d43f8d;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background-color: #d43f8d;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.2em;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #a82b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sentiment Analysis Result</h2>
        <font face="Times New Roman"><B><p style="color: #f04949">The sentiment of the message is: {{ prediction }}</p>
        <a href="/">GO BACK😁</a></B></font>
    </div>
</body>
</html>
